<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verification System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }
        .file-input-wrapper {
            position: relative;
            display: inline-block;
            width: 100%;
        }
        .file-input-wrapper input[type="file"] {
            display: none;
        }
        .file-input-label {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            border: 2px dashed #667eea;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9ff;
        }
        .file-input-label:hover {
            border-color: #764ba2;
            background: #f0f2ff;
        }
        .file-input-label.dragover {
            border-color: #764ba2;
            background: #ede9fe;
        }
        .file-input-text {
            text-align: center;
            color: #667eea;
            font-weight: 600;
        }
        .file-name {
            display: none;
            margin-top: 10px;
            padding: 10px;
            background: #f0f2ff;
            border-radius: 6px;
            color: #333;
            font-size: 14px;
        }
        .file-name.active {
            display: block;
        }
        .max-records-group {
            margin-bottom: 20px;
        }
        input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        button {
            flex: 1;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .btn-download {
            background: #10b981;
            color: white;
        }
        .btn-download:hover:not(:disabled) {
            background: #059669;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
        }
        .status-section {
            display: none;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #eee;
        }
        .status-section.active {
            display: block;
        }
        .status-message {
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .status-message.running {
            background: #e0e7ff;
            color: #3730a3;
            border-left: 4px solid #667eea;
        }
        .status-message.completed {
            background: #d1fae5;
            color: #065f46;
            border-left: 4px solid #10b981;
        }
        .status-message.error {
            background: #fee2e2;
            color: #7f1d1d;
            border-left: 4px solid #ef4444;
        }
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid #ccc;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .progress-section {
            margin-bottom: 15px;
        }
        .progress-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
        }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #eee;
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s ease;
        }
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 15px;
        }
        .stat-box {
            background: #f8f9ff;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
        }
        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
        }
        .stat-label {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Email Verification</h1>
        <p class="subtitle">Upload your CSV and get verified email addresses</p>

        <div id="uploadSection">
            <form id="uploadForm" enctype="multipart/form-data">
                <div class="form-group">
                    <label>CSV File (first_name, last_name, domain, email)</label>
                    <div class="file-input-wrapper">
                        <input type="file" id="fileInput" accept=".csv" required>
                        <label for="fileInput" class="file-input-label" id="fileLabel">
                            <div class="file-input-text">
                                Click to upload or drag & drop<br>
                                <span style="font-size: 12px; color: #999; font-weight: 400;">CSV files only</span>
                            </div>
                        </label>
                        <div class="file-name" id="fileName"></div>
                    </div>
                </div>

                <div class="form-group max-records-group">
                    <label for="maxRecords">Max Records to Process (leave empty for all)</label>
                    <input type="number" id="maxRecords" min="1" placeholder="e.g., 10">
                </div>

                <div class="button-group">
                    <button type="submit" class="btn-primary" id="submitBtn">Start Verification</button>
                </div>
            </form>
        </div>

        <div id="statusSection" class="status-section">
            <div class="status-message running" id="statusMessage">
                <div class="spinner"></div>
                <span id="statusText">Initializing...</span>
            </div>

            <div class="progress-section" id="progressSection">
                <div class="progress-label">
                    <span>Progress</span>
                    <span id="progressPercent">0%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>

            <div class="stats" id="stats" style="display: none;">
                <div class="stat-box">
                    <div class="stat-value" id="totalRecords">0</div>
                    <div class="stat-label">Total Rows</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="currentRow">0</div>
                    <div class="stat-label">Processing</div>
                </div>
            </div>

            <div class="button-group" id="downloadGroup" style="display: none; margin-top: 20px;">
                <button type="button" class="btn-download" onclick="downloadResults()">Download Results</button>
            </div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const fileLabel = document.getElementById('fileLabel');
        const fileName = document.getElementById('fileName');
        const uploadForm = document.getElementById('uploadForm');
        const statusSection = document.getElementById('statusSection');
        const submitBtn = document.getElementById('submitBtn');
        const maxRecords = document.getElementById('maxRecords');

        fileInput.addEventListener('change', function(e) {
            if (this.files.length > 0) {
                fileName.textContent = 'Selected: ' + this.files[0].name;
                fileName.classList.add('active');
            }
        });

        fileLabel.addEventListener('dragover', (e) => {
            e.preventDefault();
            fileLabel.classList.add('dragover');
        });
        fileLabel.addEventListener('dragleave', () => {
            fileLabel.classList.remove('dragover');
        });
        fileLabel.addEventListener('drop', (e) => {
            e.preventDefault();
            fileLabel.classList.remove('dragover');
            fileInput.files = e.dataTransfer.files;
            fileInput.dispatchEvent(new Event('change'));
        });

        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!fileInput.files.length) {
                alert('Please select a CSV file');
                return;
            }

            statusSection.classList.add('active');
            document.getElementById('uploadSection').style.display = 'none';
            document.getElementById('stats').style.display = 'grid';
            document.getElementById('downloadGroup').style.display = 'none';

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            if (maxRecords.value) {
                formData.append('max_records', maxRecords.value);
            }

            try {
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error('Upload failed');
                }

                pollStatus();
            } catch (error) {
                showError('Upload failed: ' + error.message);
            }
        });

        async function pollStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();

                updateUI(data);

                if (data.status === 'running') {
                    setTimeout(pollStatus, 1000);
                }
            } catch (error) {
                console.error('Status poll error:', error);
                setTimeout(pollStatus, 2000);
            }
        }

        function updateUI(data) {
            const statusMessage = document.getElementById('statusMessage');
            const statusText = document.getElementById('statusText');
            const progressFill = document.getElementById('progressFill');
            const progressPercent = document.getElementById('progressPercent');
            const totalRecords = document.getElementById('totalRecords');
            const currentRow = document.getElementById('currentRow');
            const downloadGroup = document.getElementById('downloadGroup');

            statusMessage.className = 'status-message ' + data.status;

            if (data.status === 'running') {
                statusText.textContent = data.message;
                progressFill.style.width = data.progress + '%';
                progressPercent.textContent = data.progress + '%';
                totalRecords.textContent = data.total;
                currentRow.textContent = data.current_row;
            } else if (data.status === 'completed') {
                statusText.textContent = 'Success: ' + data.message;
                progressFill.style.width = '100%';
                progressPercent.textContent = '100%';
                downloadGroup.style.display = 'flex';
            } else if (data.status === 'error') {
                statusText.textContent = 'Error: ' + (data.error || 'An error occurred');
            }
        }

        function downloadResults() {
            window.location.href = '/api/download';
        }

        function showError(message) {
            const statusMessage = document.getElementById('statusMessage');
            statusMessage.className = 'status-message error';
            document.getElementById('statusText').textContent = 'Error: ' + message;
        }
    </script>
</body>
</html>
